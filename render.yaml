services:
  - type: web
    name: careerpilot
    plan: free
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
